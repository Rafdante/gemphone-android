name: Build GemPhone Bridge APK

on:
  push:
    paths:
      - "bridge/**"
      - ".github/workflows/build-bridge-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build Debug APK
        working-directory: bridge
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gemphone-bridge-debug-apk
          path: bridge/app/build/outputs/apk/debug/app-debug.apk
