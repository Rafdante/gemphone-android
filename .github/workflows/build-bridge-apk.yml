name: Build GemPhone Bridge APK

on:
  push:
    paths:
      - "bridge/**"
      - ".github/workflows/build-bridge-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-read-only: false

      - name: Build Debug APK
        working-directory: bridge
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew 2>/dev/null || true
          gradle --no-daemon wrapper --gradle-version 8.9
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^e: |error:|FAILURE|Execution failed|Caused by|Could not|Unresolved" /tmp/build.log | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$rc"

      - name: Show errors
        if: failure()
        working-directory: bridge
        run: |
          find . -name "*.log" -maxdepth 3 | head
          echo "--- build dir ---"
          find build -maxdepth 3 -type f 2>/dev/null | head -30

      - name: Sign & report keystore
        working-directory: bridge
        run: |
          KEYSTORE=$RUNNER_TEMP/gemphone.keystore
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias gemphone \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass gemphone -keypass gemphone \
            -dname "CN=GemPhone Bridge, O=Rafdante, C=RU" >/dev/null 2>&1
          APKSIGNER=$(ls $ANDROID_SDK_ROOT/build-tools/*/apksigner | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:gemphone \
            --key-pass pass:gemphone --ks-key-alias gemphone "$APK"
          echo "::notice::Signed APK: $(basename "$APK")"
          "$APKSIGNER" verify --print-certs "$APK" | head -5
          cp "$KEYSTORE" app/build/outputs/gemphone.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: gemphone-bridge-debug
          path: |
            bridge/app/build/outputs/apk/**/*.apk
            bridge/app/build/outputs/gemphone.keystore
          if-no-files-found: error
